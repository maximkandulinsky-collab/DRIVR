name: Build iOS App for Appetize

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build iOS App for Simulator
        run: |
          SCHEME=$(xcodebuild -list -project DrivrPremiumDrivingTracker.xcodeproj | awk '/Schemes:/{flag=1;next} /^\s*$/{flag=0} flag' | head -n 1 | xargs)
          echo "Building scheme: $SCHEME"
          xcodebuild -project DrivrPremiumDrivingTracker.xcodeproj \
                     -scheme "$SCHEME" \
                     -sdk iphonesimulator \
                     -configuration Release \
                     -derivedDataPath build \
                     ONLY_ACTIVE_ARCH=NO

      - name: Zip .app Bundle for Appetize
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)
          cd $(dirname "$APP_PATH")
          zip -r ../../../drivr-appetize.zip $(basename "$APP_PATH")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drivr-appetize-build
          path: drivr-appetize.zip
